server {
    listen 80;
    server_name me.oconde.dev www.me.oconde.dev www.oconde.dev;
    server_tokens off;
    return 301 https://oconde.dev$request_uri;
}

server {
    listen 80 default_server;
    server_name oconde.dev _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    include /etc/nginx/conf.d/headers.inc;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml text/plain;
    gzip_min_length 1024;

    error_page 404 /404.html;

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    location ~ ^/(geradores|validadores|ferramentas|conversores|sugestoes|sobre|configuracoes)(/|$) {
        return 301 https://tools.oconde.dev$request_uri;
    }

    location /_astro/ {
        include /etc/nginx/conf.d/headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/conf.d/headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
