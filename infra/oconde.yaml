apiVersion: v1
kind: Namespace
metadata:
  name: oconde
  annotations:
    oconde.dev/title: oconde.dev
    oconde.dev/description: "Portfólio do Fernando Conde em oconde.dev (Astro estático, nginx), DevTools em tools.oconde.dev (Angular PWA) e páginas legais do CondeFin."
    oconde.dev/category: app
    oconde.dev/repo: github.com/nandobrazil/ocondedev
    oconde.dev/note: "ocondedev e devtools sobem por GitHub Actions + GHCR: o pipeline aplica infra/*.yaml com a imagem do commit. O Ingress compartilhado vive em ocondedev/infra/oconde.yaml. me.oconde.dev e www.* respondem 301 até 2027-01-12; depois o registro me sai do DNS, do Ingress e do certificado. condefin-legal segue sem manifesto versionado."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocondedev
  namespace: oconde
  labels:
    app: ocondedev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ocondedev
  template:
    metadata:
      labels:
        app: ocondedev
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: ocondedev
          image: ghcr.io/nandobrazil/ocondedev:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ocondedev
  namespace: oconde
spec:
  type: ClusterIP
  selector:
    app: ocondedev
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oconde
  namespace: oconde
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - oconde.dev
        - www.oconde.dev
        - me.oconde.dev
        - www.me.oconde.dev
        - tools.oconde.dev
        - condefin.oconde.dev
      secretName: oconde-tls
  rules:
    - host: oconde.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ocondedev
                port:
                  number: 80
    - host: www.oconde.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ocondedev
                port:
                  number: 80
    - host: me.oconde.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ocondedev
                port:
                  number: 80
    - host: www.me.oconde.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ocondedev
                port:
                  number: 80
    - host: tools.oconde.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devtools
                port:
                  number: 80
    - host: condefin.oconde.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: condefin-legal
                port:
                  number: 80
